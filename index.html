<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hóa Học Đại Cương - Học Tập & Ôn Luyện 8 Chương</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', Consolas, monospace;
      --bg: #f8fafc;
      --surface: #ffffff;
      --subtle: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-subtle: #eff6ff;
      --accent: #0ea5e9;
      --success: #10b981;
      --success-subtle: #ecfdf5;
      --danger: #ef4444;
      --danger-subtle: #fef2f2;
      --warning: #f59e0b;
      --warning-subtle: #fffbeb;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.08);
      --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }
    [data-theme="dark"] {
      --bg: #0b1120;
      --surface: #1e293b;
      --subtle: #172033;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-subtle: rgba(59, 130, 246, 0.15);
      --accent: #38bdf8;
      --success: #10b981;
      --success-subtle: rgba(16, 185, 129, 0.15);
      --danger: #f87171;
      --danger-subtle: rgba(239, 68, 68, 0.15);
      --warning: #fbbf24;
      --warning-subtle: rgba(245, 158, 11, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; transition: background 0.3s, color 0.3s; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
    .header-in { max-width: 1100px; margin: 0 auto; padding: 0.8rem 1rem; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: inherit; }
    .brand-icon { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 800; }
    .theme-btn { background: var(--subtle); border: 1px solid var(--border); color: var(--text); padding: 0.45rem 0.85rem; border-radius: 999px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; }
    main { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    .nav-bar { display: flex; gap: 0.4rem; overflow-x: auto; padding: 0.4rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 1.25rem; }
    .tab-btn { flex: 0 0 auto; padding: 0.55rem 0.9rem; background: transparent; border: none; border-radius: 8px; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; transition: var(--transition); }
    .tab-btn:hover { background: var(--subtle); color: var(--text); }
    .tab-btn.active { background: var(--primary); color: #fff; }
    .tab-btn .badge { background: rgba(0,0,0,0.1); padding: 0.15rem 0.4rem; border-radius: 999px; font-size: 0.72rem; }
    .tab-btn.active .badge { background: rgba(255,255,255,0.25); color: #fff; }
    .banner { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1.25rem; box-shadow: var(--shadow); }
    .ch-tag { background: var(--primary-subtle); color: var(--primary); padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .subtabs { display: flex; gap: 0.4rem; background: var(--subtle); padding: 0.3rem; border-radius: 8px; width: fit-content; margin-top: 1rem; }
    .subtab-btn { background: transparent; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); cursor: pointer; }
    .subtab-btn.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.25rem; box-shadow: var(--shadow); }
    .formula { background: var(--subtle); border-left: 3px solid var(--primary); padding: 0.75rem 1rem; margin: 0.75rem 0; font-family: var(--mono); font-size: 0.9rem; color: var(--primary); }
    .callout { background: var(--primary-subtle); border-radius: 8px; padding: 0.85rem 1rem; margin: 0.85rem 0; font-size: 0.9rem; }
    .styled-table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.85rem; }
    .styled-table th, .styled-table td { padding: 0.6rem 0.85rem; border: 1px solid var(--border); text-align: left; }
    .styled-table th { background: var(--subtle); }
    .prog-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .prog-track { width: 100%; height: 8px; background: var(--subtle); border-radius: 999px; overflow: hidden; margin-top: 0.5rem; }
    .prog-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width 0.3s; }
    .q-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; }
    .q-title { font-weight: 700; margin-bottom: 0.85rem; font-size: 0.98rem; }
    .opts { display: flex; flex-direction: column; gap: 0.5rem; }
    .opt-btn { background: var(--subtle); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 0.9rem; text-align: left; font-size: 0.9rem; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 0.7rem; transition: var(--transition); }
    .opt-btn:hover:not(:disabled) { border-color: var(--primary); transform: translateY(-1px); }
    .opt-letter { width: 24px; height: 24px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; }
    .opt-btn.is-correct { background: var(--success-subtle) !important; border-color: var(--success) !important; animation: pop 0.3s; }
    .opt-btn.is-correct .opt-letter { background: var(--success); color: #fff; }
    .opt-btn.is-wrong { background: var(--danger-subtle) !important; border-color: var(--danger) !important; animation: shake 0.35s; }
    .opt-btn.is-wrong .opt-letter { background: var(--danger); color: #fff; }
    @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.02)} 100%{transform:scale(1)} }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%,75%{transform:translateX(-3px)} 50%{transform:translateX(3px)} }
    .exp-box { margin-top: 0.85rem; padding: 0.85rem 1rem; border-radius: 8px; background: var(--subtle); border-left: 3px solid var(--primary); font-size: 0.88rem; line-height: 1.5; }
    .res-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem 1.5rem; text-align: center; margin-top: 1.5rem; }
    .res-score { font-size: 2.2rem; font-weight: 800; color: var(--primary); }
    .action-btn { background: var(--primary); color: #fff; border: none; padding: 0.7rem 1.5rem; border-radius: 999px; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 1rem; transition: var(--transition); }
    .action-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .grid-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .sum-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; display: flex; flex-direction: column; justify-content: space-between; gap: 0.75rem; }
  </style>
</head>
<body data-theme="light">

  <main>
    <div class="nav-bar" id="chNav"></div>

      <span class="ch-tag" id="bnTag">Chương 1</span>

  <footer style="text-align:center;padding:1.5rem;font-size:0.8rem;color:var(--text-muted);">
    Hệ thống tài liệu ôn thi Hóa Đại Cương theo chuẩn ĐHQG-HCM & Trường ĐH Bách Khoa.
  </footer>

  <script>
    const state = { curCh: 0, sub: 'theory', theme: 'light', userAns: {}, quizData: {} };

    const DATA = [
      {
        t: "Các Khái Niệm Và Định Luật Cơ Sở",
        d: "Khối lượng nguyên tử, mol, định luật bảo toàn khối lượng, tỉ lệ bội, đương lượng và khí lý tưởng, khí thực.",
        th: `
          <div class="card">
            <h3 style="color:var(--primary);margin-bottom:0.75rem;">1. Các khái niệm & Định luật cơ sở</h3>
            <p><strong>• Nguyên tử & Phân tử:</strong> Nguyên tử là tiểu phân nhỏ nhất của nguyên tố hóa học, không phân chia được nữa về mặt hóa học và được bảo toàn trong phản ứng hóa học (Karlsruhe 1860). Phân tử là tiểu phân nhỏ nhất của chất nguyên chất có khả năng tồn tại độc lập.</p>
            <div class="formula">1 amu = 1 đvC = 1/12 khối lượng ¹²C ≈ 1,66054 × 10⁻²⁴ g = 1,66054 × 10⁻²⁷ kg</div>
            <p><strong>• Mol & Số Avogadro:</strong> 1 mol chứa N_A = 6,02214 × 10²³ hạt vi mô.</p>
            <div class="callout">
              <strong>Định luật thành phần không đổi (Proust) & Hợp chất phi tỉ lượng:</strong>
              Hợp chất <em>Daltonit</em> có thành phần cố định (H₂O, CO₂). Hợp chất <em>Berthollit</em> (như TiO_x, Fe₀,₉₅O) có thành phần biến đổi phụ thuộc điều kiện chế tạo và khuyết tật mạng tinh thể.
            </div>
            <p><strong>• Định luật đương lượng (Dalton):</strong> Đ = M / z. Axit: z = số H⁺ trao đổi (H₂SO₄ trung hòa hoàn toàn z=2 ⇒ Đ=49). Phản ứng oxy hóa - khử: z = số e trao đổi (KMnO₄ trong mt axit nhận 5e ⇒ z=5 ⇒ Đ=158/5=31,6).</p>
            <p style="margin-top:0.75rem;"><strong>• Phương trình khí thực Van der Waals:</strong></p>
            <div class="formula">(P + n²a / V²)(V - nb) = nRT</div>
            <p>Số hạng (n²a/V²) là áp suất nội tại do lực hút tương hỗ giữa các phân tử khí; b là thể tích riêng của các phân tử.</p>
          </div>
        `,
        qs: [
          { q: "Đơn vị khối lượng nguyên tử (amu hay đvC) được quy ước theo đồng vị nào và có khối lượng bằng bao nhiêu gam?", a: ["1/12 nguyên tử carbon-12 (¹²C), xấp xỉ 1,66054 × 10⁻²⁴ g", "1/16 nguyên tử oxy-16 (¹⁶O), xấp xỉ 1,66054 × 10⁻²⁴ g", "1/1 nguyên tử hydro-1 (¹H), xấp xỉ 1,67355 × 10⁻²⁴ g", "1/12 nguyên tử carbon-12 (¹²C), xấp xỉ 1,66054 × 10⁻²⁷ g"], c: 0, e: "Theo chuẩn quốc tế, 1 amu = 1/12 khối lượng đồng vị ¹²C = 1,66054 × 10⁻²⁴ g (tương đương 1,66054 × 10⁻²⁷ kg)." },
          { q: "Hợp chất phi tỉ lượng (Berthollit) là hợp chất có đặc điểm nào sau đây?", a: ["Thành phần định lượng luôn cố định dù điều chế bằng cách nào.", "Thành phần thay đổi phụ thuộc vào điều kiện chế tạo và khuyết tật mạng tinh thể.", "Luôn tuân theo nghiêm ngặt định luật Proust.", "Chỉ gồm hợp chất cộng hóa trị phân cực."], c: 1, e: "Hợp chất Berthollit (như TiO_x, Fe₀,₉₅O) có thành phần thay đổi phụ thuộc điều kiện tạo thành và khuyết tật mạng." },
          { q: "Trong phản ứng trung hòa hoàn toàn: H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O, đương lượng của H₂SO₄ (M = 98 g/mol) là:", a: ["98 g/đlg", "49 g/đlg", "24,5 g/đlg", "196 g/đlg"], c: 1, e: "Axit trao đổi 2 H⁺ nên z = 2. Đ = M / z = 98 / 2 = 49 g/đlg." },
          { q: "Đương lượng của thuốc tím KMnO₄ (M = 158) trong môi trường axit khi bị khử thành Mn²⁺ (trao đổi 5e) là:", a: ["158 g/đlg", "79 g/đlg", "31,6 g/đlg", "52,7 g/đlg"], c: 2, e: "KMnO₄ nhận 5 electron nên z = 5 ⇒ Đ = 158 / 5 = 31,6 g/đlg." },
          { q: "Trong phương trình khí lý tưởng PV = nRT, khi P tính bằng atm, V tính bằng lít, hằng số R có giá trị là:", a: ["8,314 J/(mol·K)", "1,987 cal/(mol·K)", "0,08206 L·atm/(mol·K)", "22,414 L/mol"], c: 2, e: "Với P đo bằng atm và V đo bằng lít, R = 0,08206 L·atm·mol⁻¹·K⁻¹." },
          { q: "Trong phương trình khí thực Van der Waals: (P + n²a/V²)(V - nb) = nRT, số hạng n²a/V² và b lần lượt phản ánh:", a: ["Lực đẩy tĩnh điện và năng lượng dao động phân tử.", "Áp suất nội tại do lực hút tương hỗ giữa các phân tử và thể tích riêng của các phân tử khí.", "Độ nhớt và vận tốc chuyển động Brown.", "Số va chạm phân tử và năng lượng ion hóa."], c: 1, e: "n²a/V² là áp suất nội tại do lực hút phân tử; b là thể tích riêng của các phân tử khí thực." },
          { q: "Hỗn hợp khí gồm 0,2 mol O₂ và 0,8 mol N₂ có áp suất toàn phần là 2,5 atm. Áp suất riêng phần của O₂ là:", a: ["0,5 atm", "2,0 atm", "1,25 atm", "0,25 atm"], c: 0, e: "x_O₂ = 0,2/(0,2+0,8) = 0,2 ⇒ P_O₂ = 0,2 × 2,5 = 0,5 atm." },
          { q: "Dãy oxit của nitơ gồm N₂O, NO, N₂O₃, NO₂, N₂O₅ là minh chứng điển hình cho định luật nào?", a: ["Định luật thành phần không đổi của Proust.", "Định luật tỉ lệ bội của Dalton.", "Định luật đương lượng của Dalton.", "Định luật bảo toàn khối lượng."], c: 1, e: "Định luật tỉ lệ bội Dalton: khối lượng oxy kết hợp với cùng 1 lượng nitơ tỉ lệ với nhau như 1:2:3:4:5." },
          { q: "Ở áp suất không đổi (đẳng áp), khi tăng nhiệt độ tuyệt đối T lên gấp đôi thì thể tích V của khối khí sẽ:", a: ["Giảm đi một nửa", "Tăng lên gấp đôi", "Không đổi", "Tăng lên 4 lần"], c: 1, e: "Theo định luật Charles: V/T = const, T tăng gấp đôi thì V tăng gấp đôi." },
          { q: "Trong tự nhiên, clo có hai đồng vị ³⁵Cl (75,77%) và ³⁷Cl (24,23%). Khối lượng nguyên tử trung bình của clo là:", a: ["36,00 amu", "35,48 amu", "35,50 amu", "36,50 amu"], c: 1, e: "Ā = 35 × 0,7577 + 37 × 0,2423 = 35,4846 ≈ 35,48 amu." }
        ]
      },
      {
        t: "Cấu Tạo Nguyên Tử Và Định Luật Tuần Hoàn",
        d: "Lượng tử hóa Bohr, Heisenberg, phương trình Schrödinger, 4 số lượng tử, quy tắc Klechkovski, Hund và quy luật tuần hoàn.",
        th: `
          <div class="card">
            <h3 style="color:var(--primary);margin-bottom:0.75rem;">2. Cấu tạo nguyên tử & Bảng tuần hoàn</h3>
            <p><strong>• Tiên đề Bohr & Bán kính quỹ đạo:</strong> r_n = 0,529 · (n² / Z) Å. Bán kính tỉ lệ thuận với n².</p>
            <p><strong>• Cơ học lượng tử:</strong> Nguyên lý bất định Heisenberg Δx·Δp_x ≥ h/(4π). Bình phương môđun hàm sóng |ψ|² biểu thị <em>mật độ xác suất tìm thấy electron</em>.</p>
            <p><strong>• 4 số lượng tử:</strong></p>
            <ul style="margin:0.5rem 0 0.5rem 1.25rem;">
              <li>n (1, 2, 3...): Mức năng lượng chính, kích thước AO. Số AO trong lớp n là n²; số e tối đa là 2n².</li>
              <li>l (0 đến n-1; s, p, d, f): Hình dạng AO (s: cầu, p: số 8 nổi, d: cánh hoa 4 thùy).</li>
              <li>m_l (-l đến +l): Sự định hướng không gian của AO trong từ trường.</li>
              <li>m_s (±1/2): Spin riêng của electron.</li>
            </ul>
            <p><strong>• Quy tắc Klechkovski:</strong> Năng lượng tăng theo tổng (n + l), nếu bằng nhau thì n nhỏ hơn điền trước (4s có n+l=4 điền trước 3d có n+l=5). Bán bão hòa sớm: Cr: [Ar]3d⁵4s¹; Cu: [Ar]3d¹⁰4s¹.</p>
            <div class="callout">
              <strong>Quy luật tuần hoàn:</strong> Bán kính giảm dần trong chu kỳ, tăng dần trong nhóm chính. Dãy đẳng electron: r_O²⁻ > r_F⁻ > r_Na⁺ > r_Mg²⁺ > r_Al³⁺ (Z càng lớn lực hút càng mạnh, r càng nhỏ). Năng lượng ion hóa I₁(N) > I₁(O) do phân lớp 2p³ bán bão hòa bền vững.
            </div>
          </div>
        `,

          { q: "Cho pin tiêu chuẩn (-) Zn | Zn²⁺(1M) || Cu²⁺(1M) | Cu (+). φ°_Zn = -0,76V; φ°_Cu = +0,34V. E°_pin là:", a: ["0,42 V", "1,10 V", "-1,10 V", "-0,42 V"], c: 1, e: "E°_pin = φ°_Cathode - φ°_Anode = 0,34 - (-0,76) = 1,10 V." },
          { q: "Mối liên hệ giữa ΔG° và E°_pin của phản ứng trong pin điện là:", a: ["ΔG° = -n·F·E°_pin", "ΔG° = n·F·E°_pin", "ΔG° = -R·T·E°_pin", "E°_pin = -n·F·ΔG°"], c: 0, e: "A_điện = -ΔG = n·F·E_pin ⇒ ΔG° = -n·F·E°_pin." },
          { q: "Cho Fe³⁺/Fe²⁺ (φ° = +0,77V) và I₂/2I⁻ (φ° = +0,54V). Theo quy tắc α, phản ứng tự phát là:", a: ["2Fe²⁺ + I₂ → 2Fe³⁺ + 2I⁻", "2Fe³⁺ + 2I⁻ → 2Fe²⁺ + I₂", "Fe³⁺ + I₂ → Fe²⁺ + 2I⁻", "Không phản ứng."], c: 1, e: "Dạng oxy hóa mạnh hơn (Fe³⁺) oxy hóa dạng khử mạnh hơn (I⁻): 2Fe³⁺ + 2I⁻ → 2Fe²⁺ + I₂." },
          { q: "Khi điện phân dung dịch NaCl có màng ngăn, quá trình xảy ra tại CATHODE là:", a: ["Na⁺ bị khử thành Na.", "H₂O bị khử tạo H₂ và OH⁻ (2H₂O + 2e → H₂ + 2OH⁻).", "Cl⁻ bị oxy hóa tạo Cl₂.", "H₂O bị oxy hóa tạo O₂."], c: 1, e: "Na⁺ không bị khử trong nước, thay vào đó nước bị khử tạo khí H₂ và OH⁻." },
          { q: "Điện phân dung dịch chứa Fe³⁺, Cu²⁺, Ag⁺, Ni²⁺ (đều 1M) với điện cực trơ, thứ tự khử tại CATHODE là:", a: ["Ni²⁺ → Cu²⁺ → Fe³⁺ → Ag⁺", "Ag⁺ → Fe³⁺ (thành Fe²⁺) → Cu²⁺ → Ni²⁺", "Cu²⁺ → Ag⁺ → Ni²⁺ → Fe³⁺", "Đồng thời."], c: 1, e: "Thứ tự thế giảm dần: φ°(Ag⁺) > φ°(Fe³⁺/Fe²⁺) > φ°(Cu²⁺) > φ°(Ni²⁺) nên Ag⁺ khử trước." },
          { q: "Điện phân dung dịch CuSO₄ với ANODE BẰNG ĐỒNG (anode tan), hiện tượng tại Anode là:", a: ["Nước bị oxy hóa tạo O₂.", "Đồng Anode bị oxy hóa tan ra: Cu → Cu²⁺ + 2e.", "Khí SO₂ thoát ra.", "Đồng bám vào Anode."], c: 1, e: "Với Anode Cu, Cu bị oxy hóa tan ra trước nước và anion: Cu → Cu²⁺ + 2e." },
          { q: "Điện phân dung dịch AgNO₃ với I = 5 A trong 1930 giây. Khối lượng Ag (M = 108) bám vào Cathode là:", a: ["5,4 gam", "10,8 gam", "21,6 gam", "1,08 gam"], c: 1, e: "m = (A·I·t)/(n·F) = (108 × 5 × 1930) / (1 × 96500) = 10,8 gam." }
        ]
      }
    ];

    function renderNav() {
      const el = document.getElementById('chNav');
      let html = '';
      DATA.forEach((ch, i) => {
        const active = (state.curCh === i) ? 'active' : '';
        const ans = state.userAns[i] ? Object.keys(state.userAns[i]).length : 0;
        html += `<button class="tab-btn ${active}" onclick="goTab(${i})">Chương ${i+1} <span class="badge">${ans}/10</span></button>`;
      });
      const sumActive = (state.curCh === 8) ? 'active' : '';
      html += `<button class="tab-btn ${sumActive}" onclick="goTab(8)">📊 Tổng kết 8 chương</button>`;
      el.innerHTML = html;
    }

    function goTab(idx) {
      state.curCh = idx;
      renderNav();
      const bn = document.getElementById('chBanner');
      if (idx === 8) {
        bn.style.display = 'none';
        renderSummary();
        return;
      }
      bn.style.display = 'block';
      const c = DATA[idx];
      document.getElementById('bnTag').innerText = `CHƯƠNG ${idx+1}`;
      document.getElementById('bnTitle').innerText = c.t;
      document.getElementById('bnDesc').innerText = c.d;
      updateQCount();
      renderMain();
    }

    function goSub(sub) {
      state.sub = sub;
      document.getElementById('subTheory').classList.toggle('active', sub === 'theory');
      document.getElementById('subQuiz').classList.toggle('active', sub === 'quiz');
      renderMain();
    }

    function updateQCount() {
      const ans = state.userAns[state.curCh] ? Object.keys(state.userAns[state.curCh]).length : 0;
      document.getElementById('qCount').innerText = `${ans}/10`;
    }

    function getQuiz(chIdx) {
      if (!state.quizData[chIdx]) {
        state.quizData[chIdx] = DATA[chIdx].qs.map((q, oIdx) => {
          const opts = q.a.map((txt, idx) => ({ txt, isC: (idx === q.c) }));
          // shuffle options
          for (let i = opts.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [opts[i], opts[j]] = [opts[j], opts[i]];
          }
          return {
            q: q.q,
            opts: opts.map(o => o.txt),
            c: opts.findIndex(o => o.isC),
            e: q.e
          };
        });
      }
      return state.quizData[chIdx];
    }

    function renderMain() {
      const el = document.getElementById('mainView');
      const ch = state.curCh;
      if (state.sub === 'theory') {
        el.innerHTML = DATA[ch].th + `
          <div style="text-align:center;margin-top:1.5rem;">
            <button class="action-btn" onclick="goSub('quiz')">✍️ Chuyển sang làm 10 câu trắc nghiệm Chương ${ch+1}</button>
          </div>
        `;
      } else {
        renderQuiz();
      }
    }

    function renderQuiz() {
      const el = document.getElementById('mainView');
      const ch = state.curCh;
      const qs = getQuiz(ch);
      const ans = state.userAns[ch] || {};
      const ansCount = Object.keys(ans).length;
      let correctCount = 0;
      qs.forEach((q, i) => { if (ans[i] === q.c) correctCount++; });

      let h = `
        <div class="prog-card">
          <div style="display:flex;justify-content:space-between;font-size:0.85rem;font-weight:700;">
            <span>Tiến độ: ${ansCount}/10 câu</span>
            <span>Đúng: <strong style="color:var(--success);">${correctCount}</strong> | Sai: <strong style="color:var(--danger);">${ansCount - correctCount}</strong></span>
          </div>
          <div class="prog-track"><div class="prog-fill" style="width:${ansCount * 10}%"></div></div>
        </div>
      `;

      qs.forEach((q, qIdx) => {
        const uAns = ans[qIdx];
        const done = (uAns !== undefined);
        h += `
          <div class="q-card" id="qc_${qIdx}">
            <div style="font-size:0.8rem;color:var(--primary);font-weight:700;margin-bottom:0.3rem;">CÂU ${qIdx+1} / 10</div>
            <div class="q-title">${q.q}</div>
            <div class="opts">
        `;
        const letters = ['A', 'B', 'C', 'D'];
        q.opts.forEach((txt, oIdx) => {
          let cls = 'opt-btn';
          if (done) {
            if (oIdx === q.c) cls += ' is-correct';
            else if (oIdx === uAns) cls += ' is-wrong';
          }
          h += `
            <button class="${cls}" ${done ? 'disabled' : ''} onclick="chooseOpt(${ch}, ${qIdx}, ${oIdx})">
              <span class="opt-letter">${letters[oIdx]}</span>
              <span>${txt}</span>
            </button>
          `;
        });
        h += `</div>`;
        if (done) {
          const isRight = (uAns === q.c);
          h += `
            <div class="exp-box">
              <div style="font-weight:700;color:${isRight ? 'var(--success)' : 'var(--danger)'};margin-bottom:0.25rem;">
                ${isRight ? '✅ Đúng!' : '❌ Chưa đúng!'} (Đáp án đúng: <strong>${letters[q.c]}</strong>)
              </div>
              <div>${q.e}</div>
            </div>
          `;
        }
        h += `</div>`;
      });

      if (ansCount === 10) {
        const pct = correctCount * 10;
        h += `
          <div class="res-card">
            <h3 style="font-size:1.3rem;font-weight:800;">KẾT QUẢ ÔN TẬP CHƯƠNG ${ch+1}</h3>
            <div class="res-score">${pct}%</div>
            <p style="font-weight:600;margin:0.5rem 0;">Điểm số: ${correctCount}/10 câu đúng</p>
            <p style="color:var(--text-muted);font-size:0.9rem;">
              ${pct >= 80 ? 'Xuất sắc! Bạn đã nắm rất vững kiến thức chương này.' : pct >= 50 ? 'Khá tốt! Hãy ôn lại các câu sai để ghi nhớ lâu hơn.' : 'Cần ôn lại kỹ hơn phần lý thuyết.'}
            </p>
            <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;">
              <button class="action-btn" onclick="retake(${ch})">🔄 Làm lại chương này</button>
              ${ch < 7 ? `<button class="action-btn" style="background:var(--accent);" onclick="goTab(${ch+1})">Sang Chương ${ch+2} ➔</button>` : `<button class="action-btn" style="background:var(--accent);" onclick="goTab(8)">Xem Tổng kết 8 chương 📊</button>`}
            </div>
          </div>
        `;
      }
      el.innerHTML = h;
    }

    function chooseOpt(ch, qIdx, optIdx) {
      if (!state.userAns[ch]) state.userAns[ch] = {};
      if (state.userAns[ch][qIdx] !== undefined) return;
      state.userAns[ch][qIdx] = optIdx;
      updateQCount();
      renderNav();
      renderQuiz();
    }

    function retake(ch) {
      if (state.userAns[ch]) delete state.userAns[ch];
      delete state.quizData[ch]; // re-shuffle
      updateQCount();
      renderNav();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderSummary() {
      const el = document.getElementById('mainView');
      let totalAns = 0, totalCor = 0;
      DATA.forEach((c, idx) => {
        const ans = state.userAns[idx] || {};
        const qs = getQuiz(idx);
        Object.keys(ans).forEach(qI => {
          totalAns++;
          if (ans[qI] === qs[qI].c) totalCor++;
        });
      });

      let h = `
        <div class="card">
          <h2 style="font-size:1.4rem;font-weight:800;color:var(--text);margin-bottom:0.5rem;">Bảng Tổng Kết Toàn Bộ 8 Chương</h2>
          <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:1.5rem;">Theo dõi số câu đã làm, số câu đúng và điểm trung bình tích lũy.</p>
          <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:1rem;margin-bottom:1.5rem;">
            <div style="background:var(--subtle);padding:1rem;border-radius:10px;text-align:center;">
              <div style="font-size:0.8rem;color:var(--text-muted);font-weight:700;">ĐÃ LÀM</div>
              <div style="font-size:1.8rem;font-weight:800;color:var(--primary);">${totalAns} / 80</div>
            </div>
            <div style="background:var(--subtle);padding:1rem;border-radius:10px;text-align:center;">
              <div style="font-size:0.8rem;color:var(--text-muted);font-weight:700;">CÂU ĐÚNG</div>
              <div style="font-size:1.8rem;font-weight:800;color:var(--success);">${totalCor} / ${totalAns || 0}</div>
            </div>
            <div style="background:var(--subtle);padding:1rem;border-radius:10px;text-align:center;">
              <div style="font-size:0.8rem;color:var(--text-muted);font-weight:700;">TỈ LỆ ĐÚNG</div>
              <div style="font-size:1.8rem;font-weight:800;color:var(--accent);">${totalAns > 0 ? Math.round((totalCor/totalAns)*100) : 0}%</div>
            </div>
          </div>
          <h3 style="font-size:1.1rem;font-weight:700;margin-bottom:0.75rem;">Chi tiết từng chương:</h3>
          <div class="grid-summary">
      `;
      DATA.forEach((c, idx) => {
        const ans = state.userAns[idx] || {};
        const qs = getQuiz(idx);
        let cor = 0;
        Object.keys(ans).forEach(qI => { if (ans[qI] === qs[qI].c) cor++; });
        const aCount = Object.keys(ans).length;
        h += `
          <div class="sum-item">
            <div>
              <div style="font-size:0.75rem;font-weight:700;color:var(--primary);">CHƯƠNG ${idx+1}</div>
              <div style="font-weight:700;font-size:0.95rem;margin:0.25rem 0;">${c.t}</div>
              <div style="font-size:0.82rem;color:var(--text-muted);">Hoàn thành: ${aCount}/10 câu (${cor} đúng)</div>
            </div>
            <button class="action-btn" style="margin-top:0.5rem;padding:0.45rem 1rem;font-size:0.8rem;width:fit-content;" onclick="goTab(${idx})">Vào học ➔</button>
          </div>
        `;
      });
      h += `</div></div>`;
      el.innerHTML = h;
    }

    function toggleTheme() {
      const cur = document.body.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', next);
      state.theme = next;
      document.getElementById('themeIco').innerText = next === 'dark' ? '☀️' : '🌙';
      document.getElementById('themeLbl').innerText = next === 'dark' ? 'Sáng' : 'Tối';
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderNav();
      goTab(0);
    });
  </script>
</body>
</html>
